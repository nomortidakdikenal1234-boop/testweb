    function App() {
      const [settings, setSettings] = useState(INITIAL_SETTINGS);
      const [programs, setPrograms] = useState(INITIAL_PROGRAMS);
      const [donations, setDonations] = useState(INITIAL_DONATIONS);
      const [gallery, setGallery] = useState(INITIAL_GALLERY);
      const [isLoading, setIsLoading] = useState(true);

      const [currentRoute, setCurrentRoute] = useState('home');
      const [selectedProgram, setSelectedProgram] = useState(null);
      const [infaqSuccessData, setInfaqSuccessData] = useState(null);

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState("Semua");
      const [galleryCategory, setGalleryCategory] = useState("Semua");
      const [toastMessage, setToastMessage] = useState(null);

      // Fetching data dari Supabase
      useEffect(() => {
        async function fetchInitialData() {
          if (!supabaseClient) {
            setIsLoading(false);
            return;
          }
          try {
            // 1. Fetch Programs
            const { data: progData, error: progErr } = await supabaseClient
              .from('programs')
              .select('*')
              .order('created_at', { ascending: false });

            if (!progErr && progData) {
              setPrograms(progData.map(p => ({
                id: p.id,
                title: p.title,
                category: p.category || 'Pendidikan',
                description: p.description || '',
                fullContent: p.full_content || p.description || '',
                targetAmount: Number(p.target_amount || 0),
                currentAmount: Number(p.current_amount || 0),
                beneficiaries: Number(p.beneficiaries || 0),
                imageUrl: p.image_url || '',
                status: p.status || 'Aktif'
              })));
            }

            // 2. Fetch Donations
            const { data: donData, error: donErr } = await supabaseClient
              .from('donations')
              .select('*')
              .order('created_at', { ascending: false });

            if (!donErr && donData) {
              setDonations(donData.map(d => ({
                id: d.id,
                donorName: d.donor_name || 'Hamba Allah',
                amount: Number(d.amount || 0),
                programTitle: d.program_title || 'Infaq Umum',
                paymentMethod: d.payment_method || 'WhatsApp Transfer',
                status: d.status || 'Terverifikasi',
                date: new Date(d.created_at).toLocaleString('id-ID'),
                notes: d.notes || ''
              })));
            }

            // 3. Fetch Gallery
            const { data: galData, error: galErr } = await supabaseClient
              .from('gallery')
              .select('*')
              .order('created_at', { ascending: false });

            if (!galErr && galData) {
              setGallery(galData.map(g => ({
                id: g.id,
                title: g.title,
                category: g.category || 'Pendidikan',
                description: g.description || '',
                imageUrl: g.image_url || ''
              })));
            }

            // 4. Fetch Settings
            const { data: setDb, error: setErr } = await supabaseClient
              .from('settings')
              .select('*')
              .maybeSingle();

            if (!setErr && setDb) {
              setSettings({
                orgName: setDb.org_name || INITIAL_SETTINGS.orgName,
                tagline: setDb.tagline || INITIAL_SETTINGS.tagline,
                subTagline: setDb.sub_tagline || INITIAL_SETTINGS.subTagline,
                description: setDb.description || INITIAL_SETTINGS.description,
                address: setDb.address || INITIAL_SETTINGS.address,
                whatsapp: setDb.whatsapp || INITIAL_SETTINGS.whatsapp,
                email: setDb.email || INITIAL_SETTINGS.email,
                tiktok: setDb.tiktok || INITIAL_SETTINGS.tiktok,
                instagram: setDb.instagram || INITIAL_SETTINGS.instagram,
                facebook: setDb.facebook || INITIAL_SETTINGS.facebook,
                logoUrl: setDb.logo_url || INITIAL_SETTINGS.logoUrl
              });
            }
          } catch (err) {
            console.warn("Fetch error:", err);
          } finally {
            setIsLoading(false);
          }
        }

        fetchInitialData();
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handlePublicInfaqSubmit = async (formData) => {
        const newTrxId = `TRX-${Math.floor(10000 + Math.random() * 90000)}`;
        const donorName = formData.isAnon ? "Hamba Allah" : (formData.name || "Hamba Allah");
        const amountNum = Number(formData.amount);
        
        const newTrx = {
          id: newTrxId,
          donorName: donorName,
          amount: amountNum,
          programTitle: formData.programTitle,
          paymentMethod: formData.paymentMethod,
          status: "Terverifikasi",
          date: new Date().toLocaleString('id-ID'),
          notes: formData.notes || ""
        };

        setDonations(prev => [newTrx, ...prev]);
        setInfaqSuccessData({ ...newTrx, actualName: formData.name });

        setPrograms(prevPrograms => prevPrograms.map(p => {
          if (p.title === formData.programTitle) {
            return { ...p, currentAmount: (p.currentAmount || 0) + amountNum };
          }
          return p;
        }));

        if (supabaseClient) {
          try {
            await supabaseClient.from('donations').insert([{
              id: newTrxId,
              donor_name: donorName,
              donor_phone: formData.phone || null,
              donor_email: formData.email || null,
              is_anonymous: formData.isAnon,
              amount: amountNum,
              program_title: formData.programTitle,
              payment_method: formData.paymentMethod,
              status: "Terverifikasi",
              notes: formData.notes || null
            }]);

            const { data: currentProg } = await supabaseClient
              .from('programs')
              .select('id, current_amount')
              .eq('title', formData.programTitle)
              .maybeSingle();

            if (currentProg) {
              const updatedAmt = (Number(currentProg.current_amount) || 0) + amountNum;
              await supabaseClient
                .from('programs')
                .update({ current_amount: updatedAmt })
                .eq('id', currentProg.id);
            }
          } catch (err) {
            console.warn("Error updating Supabase:", err);
          }
        }

        showToast("Permohonan infaq berhasil dibuat!");
      };

      return (
        <div className="min-h-screen bg-white text-slate-800 font-sans antialiased flex flex-col">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-[9999] bg-[#1F5946] text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm border border-[#B89355]/40 animate-fade-in">
              <span className="w-2.5 h-2.5 rounded-full bg-[#B89355]"></span>
              <span className="font-medium">{toastMessage}</span>
            </div>
          )}

          <PublicNavbar 
            mobileMenuOpen={mobileMenuOpen}
            setMobileMenuOpen={setMobileMenuOpen}
            setCurrentRoute={setCurrentRoute}
          />

          <main className="flex-grow bg-white">
            {currentRoute === 'home' && (
              <>
                <HeroSection />
                <AboutUsSection />
                <ProgramsSection 
                  programs={programs}
                  isLoading={isLoading}
                  selectedCategory={selectedCategory}
                  setSelectedCategory={setSelectedCategory}
                  onSelectProgram={(prog) => { setSelectedProgram(prog); setCurrentRoute('program-detail'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                  onInfaqNow={(prog) => { setSelectedProgram(prog); setCurrentRoute('infaq'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                />
                <GallerySection gallery={gallery} isLoading={isLoading} galleryCategory={galleryCategory} setGalleryCategory={setGalleryCategory} />
              </>
            )}

            {currentRoute === 'program-detail' && selectedProgram && (
              <ProgramDetailView 
                program={selectedProgram}
                onBack={() => { setCurrentRoute('home'); setSelectedProgram(null); }}
                onInfaqNow={() => { setCurrentRoute('infaq'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                recentDonations={donations.filter(d => d.programTitle === selectedProgram.title && d.status === 'Terverifikasi')}
              />
            )}

            {currentRoute === 'infaq' && (
              <InfaqFormView 
                programs={programs}
                selectedProgram={selectedProgram}
                settings={settings}
                onSubmitInfaq={handlePublicInfaqSubmit}
                successData={infaqSuccessData}
                onReset={() => setInfaqSuccessData(null)}
                onBack={() => { setCurrentRoute('home'); setInfaqSuccessData(null); }}
                showToast={showToast}
              />
            )}
          </main>

          <PublicFooter settings={settings} />
        </div>
      );
    }

    function PublicNavbar({ mobileMenuOpen, setMobileMenuOpen, setCurrentRoute }) {
      const [isScrolled, setIsScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { label: "Beranda", href: "#beranda" },
        { label: "Tentang Kami", href: "#tentang" },
        { label: "Program Infaq", href: "#program" },
        { label: "Galeri Dokumentasi", href: "#galeri" }
      ];

      return (
        <nav className={`sticky top-0 z-50 transition-all duration-300 ${
          isScrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-3 border-b border-slate-100' : 'bg-white py-4 border-b border-slate-100/70'

    function InfaqFormView({ programs, selectedProgram, settings, onSubmitInfaq, successData, onReset, onBack, showToast }) {
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        email: '',
        isAnon: false,
        amount: '50000',
        customAmount: '',
        programTitle: selectedProgram ? selectedProgram.title : (programs[0]?.title || "Infaq Umum"),
        paymentMethod: "WhatsApp Transfer",
        notes: ''
      });

      const presetAmounts = ["10000", "25000", "50000", "100000", "250000", "500000"];

      const handleNominalClick = (val) => {
        setFormData({ ...formData, amount: val, customAmount: '' });
      };

      const handleCustomNominal = (e) => {
        const raw = e.target.value.replace(/\D/g, '');
        setFormData({ ...formData, amount: raw, customAmount: raw });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalAmount = Number(formData.amount);
        if (!finalAmount || finalAmount < 5000) {
          showToast("Nominal infaq minimal Rp 5.000");
          return;
        }

        const donorName = formData.isAnon ? "Hamba Allah" : (formData.name || "Hamba Allah");
        const cleanWA = settings.whatsapp.replace(/\D/g, '');

        let waText = `Assalamualaikum Lembaga Infaq Nurul Hayah,\n\n`;
        waText += `Saya ingin menyalurkan infaq dengan rincian berikut:\n`;
        waText += `• Nama: ${donorName}\n`;
        waText += `• Nominal Infaq: ${formatIDR(finalAmount)}\n`;
        waText += `• Program: ${formData.programTitle}\n`;
        if (formData.phone) waText += `• No. WA/HP: ${formData.phone}\n`;
        if (formData.notes) waText += `• Doa/Niat: ${formData.notes}\n`;
        waText += `\nMohon informasi Nomor Rekening / QRIS untuk pengiriman infaq. Terima kasih.`;

        const waUrl = `https://wa.me/${cleanWA}?text=${encodeURIComponent(waText)}`;

        onSubmitInfaq(formData);
        window.open(waUrl, '_blank');
      };

      if (successData) {
        return (
          <div className="max-w-xl mx-auto px-4 py-16">
            <div className="bg-white rounded-3xl p-8 shadow-2xl border border-slate-200 text-center space-y-6">
              <div className="w-16 h-16 bg-emerald-50 text-[#1F5946] border border-emerald-200 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                <Icons.CheckCircle />
              </div>
              <div>
                <h2 className="text-2xl font-black text-slate-900">Jazakallahu Khairan</h2>
                <p className="text-xs text-slate-500 mt-1">ID Transaksi: <span className="font-mono font-bold text-[#1F5946]">{successData.id}</span></p>
              </div>

              <div className="p-5 bg-slate-50 rounded-2xl border border-slate-200 text-left space-y-3 text-xs">
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Program:</span>
                  <span className="font-bold text-slate-800 text-right max-w-xs">{successData.programTitle}</span>
                </div>
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Nominal Infaq:</span>
                  <span className="font-black text-[#1F5946] text-base">{formatIDR(successData.amount)}</span>
                </div>
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Nama Donatur:</span>
                  <span className="font-semibold text-slate-800">{successData.donorName}</span>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3 pt-2">
                <a
                  href={`https://wa.me/${settings.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(`Assalamualaikum Lembaga Infaq Nurul Hayah,\n\nSaya ingin meminta Nomor Rekening / QRIS untuk transaksi ID: ${successData.id} sebesar ${formatIDR(successData.amount)}`)}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="flex-1 py-3.5 bg-[#1F5946] hover:bg-[#174435] text-white rounded-xl font-bold text-sm flex items-center justify-center space-x-2 shadow-md"
                >
                  <Icons.WhatsApp />
                  <span>Buka WhatsApp (Minta Rekening / QRIS)</span>
                </a>
                <button
                  onClick={() => { onReset(); onBack(); }}
                  className="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm"
                >
                  Selesai
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto px-4 py-12">
          <div className="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-10">
            <div className="text-center mb-8">
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2">
                Form Salurkan Infaq
              </h1>
              <p className="text-slate-500 text-xs sm:text-sm mt-1">
                Isi data di bawah ini, lalu klik tombol untuk langsung terhubung ke WhatsApp kami untuk mendapatkan Nomor Rekening / QRIS.
              </p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-6">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  Pilihan Program Kebaikan
                </label>
                <select
                  value={formData.programTitle}
                  onChange={(e) => setFormData({ ...formData, programTitle: e.target.value })}
                  className="w-full px-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-[#1F5946] outline-none"
                >
                  {programs.length === 0 ? (
                    <option value="Infaq Umum">Infaq Umum / Operasional</option>
                  ) : (
                    programs.map((p) => (
                      <option key={p.id} value={p.title}>{p.title} ({p.category})</option>
                    ))
                  )}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  Nominal Infaq
                </label>
                <div className="grid grid-cols-3 gap-2.5 mb-3">
                  {presetAmounts.map((val) => (
                    <button
                      type="button"
                      key={val}
                      onClick={() => handleNominalClick(val)}
                      className={`py-3 px-2 rounded-2xl text-xs font-bold border transition-all ${
                        formData.amount === val && !formData.customAmount
                          ? 'bg-[#1F5946] text-white border-[#1F5946] shadow-sm'
                          : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:border-[#1F5946]/40'
                      }`}
                    >
                      {formatIDR(Number(val))}
                    </button>
                  ))}
                </div>

                <div className="relative">
                  <span className="absolute left-4 top-3.5 text-sm font-bold text-slate-400">Rp</span>
                  <input
                    type="text"
                    placeholder="Nominal lainnya (Contoh: 1.000.000)"
                    value={formData.customAmount ? formatNumber(formData.customAmount) : ''}
                    onChange={handleCustomNominal}
                    className="w-full pl-12 pr-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm font-bold text-[#1F5946] focus:ring-2 focus:ring-[#1F5946] outline-none"
                  />
                </div>
              </div>

              <div className="space-y-4 pt-2 border-t border-slate-100">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Nama Lengkap
                  </label>
                  <input
                    type="text"
                    required={!formData.isAnon}
                    placeholder="Masukkan nama Anda"
                    value={formData.name}
                    disabled={formData.isAnon}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                    className="w-full px-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm text-slate-800 focus:ring-2 focus:ring-[#1F5946] outline-none disabled:opacity-50"
                  />
                </div>

                <div className="flex items-center space-x-2">
                  <input
                    type="checkbox"
                    id="anonCheck"
                    checked={formData.isAnon}
                    onChange={(e) => setFormData({ ...formData, isAnon: e.target.checked })}
                    className="w-4 h-4 text-[#1F5946] rounded focus:ring-[#1F5946]"
                  />
                  <label htmlFor="anonCheck" className="text-xs text-slate-600 font-semibold cursor-pointer">
                    Sembunyikan nama (Infaq atas nama <strong>Hamba Allah</strong>)
                  </label>
                </div>

                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      Nomor WhatsApp / HP
                    </label>
                    <input
                      type="tel"
                      placeholder="08xxxxxxxxxx"
                      value={formData.phone}
                      onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                      className="w-full px-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm text-slate-800 focus:ring-2 focus:ring-[#1F5946] outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      Email (Opsional)
                    </label>
                    <input
                      type="email"
                      placeholder="alamat@email.com"
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      className="w-full px-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm text-slate-800 focus:ring-2 focus:ring-[#1F5946] outline-none"
                    />
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Doa / Niat Khusus
                </label>
                <textarea
                  rows={2}
                  placeholder="Tuliskan niat atau doa Anda..."
                  value={formData.notes}
                  onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                  className="w-full px-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm text-slate-800 focus:ring-2 focus:ring-[#1F5946] outline-none"
                ></textarea>
              </div>

              <button
                type="submit"
                className="w-full py-4 bg-[#1F5946] hover:bg-[#174435] text-white font-bold rounded-2xl shadow-xl transition duration-200 flex items-center justify-center space-x-2 text-base"
              >
                <Icons.WhatsApp />
                <span>Minta No. Rekening / QRIS via WhatsApp ({formatIDR(Number(formData.amount))})</span>
              </button>
            </form>
          </div>
        </div>
      );
    }

    function GallerySection({ gallery, galleryCategory, setGalleryCategory }) {
      const categories = ["Semua", "Pendidikan", "Santunan", "Sosial", "Ramadhan", "Pembangunan"];

      const filteredGallery = useMemo(() => {
        if (galleryCategory === "Semua") return gallery;
        return gallery.filter(g => g.category === galleryCategory);
      }, [gallery, galleryCategory]);

      return (
        <section id="galeri" className="py-20 bg-white border-b border-slate-100">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-end justify-between mb-12">
              <div>
                <h2 className="text-3xl sm:text-4xl font-black text-slate-900">
                  Galeri Kegiatan Lembaga
                </h2>
                <p className="text-slate-600 text-sm mt-2">
                  Dokumentasi kegiatan dan penyaluran manfaat program Nurul Hayah.
                </p>
              </div>

              <div className="flex flex-wrap gap-1.5 mt-6 md:mt-0">
                {categories.map((c, i) => (
                  <button
                    key={i}
                    onClick={() => setGalleryCategory(c)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition ${
                      galleryCategory === c
                        ? 'bg-[#1F5946] text-white shadow-sm'
                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            {filteredGallery.length === 0 ? (
              <div className="text-center py-16 bg-slate-50 rounded-3xl border border-slate-200 max-w-xl mx-auto p-8 space-y-3">
                <h3 className="font-bold text-slate-800 text-base">Belum Ada Dokumentasi Kegiatan</h3>
                <p className="text-slate-500 font-medium text-xs leading-relaxed">
                  Dokumentasi foto kegiatan dan penyaluran infaq akan ditampilkan di sini.
                </p>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredGallery.map((item) => (
                  <div 
                    key={item.id}
                    className="group relative h-72 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500 bg-white border border-slate-200"
                  >
                    <img 
                      src={item.imageUrl} 
                      alt={item.title} 
                      className="w-full h-full object-cover group-hover:scale-110 transition duration-700"
                      onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=700&q=80"; }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent opacity-90 group-hover:opacity-100 transition"></div>
                    
                    <div className="absolute bottom-0 p-6 text-white">
                      <span className="text-[10px] font-bold bg-[#B89355] text-white px-2.5 py-0.5 rounded-full uppercase tracking-wider mb-2 inline-block">
                        {item.category}
                      </span>
                      <h3 className="font-bold text-base leading-snug">{item.title}</h3>
                      <p className="text-xs text-slate-200 mt-1 line-clamp-2">{item.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>
      );
    }

    function PublicFooter({ settings }) {
      const cleanWA = settings.whatsapp ? settings.whatsapp.replace(/\D/g, '') : '6282333362299';

      return (
        <footer className="bg-white border-t border-slate-200 pt-16 pb-8 text-slate-600">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 pb-12 border-b border-slate-200">
              
              <div className="space-y-4">
                <NurulHayahLogo />
                <p className="text-xs sm:text-sm text-slate-500 leading-relaxed pt-2">
                  Lembaga Infaq Nurul Hayah mengelola dan menyalurkan dana infaq secara transparan, amanah, dan profesional demi menghadirkan pendidikan berkualitas serta kesejahteraan bagi santri dan dhuafa di seluruh Indonesia.
                </p>
              </div>

              <div className="space-y-4">
                <h4 className="font-bold text-slate-900 text-base">Alamat Kantor</h4>
                <div className="space-y-3 text-xs text-slate-600">
                  <div className="flex items-start space-x-3">
                    <span className="text-[#B89355] mt-0.5 flex-shrink-0"><Icons.MapPin /></span>
                    <span className="leading-relaxed">{settings.address}</span>
                  </div>
                  <div className="flex items-center space-x-3">
                    <span className="text-[#B89355] flex-shrink-0"><Icons.Mail /></span>
                    <a href={`mailto:${settings.email}`} className="hover:text-[#1F5946] hover:underline truncate font-medium">
                      {settings.email}
                    </a>
                  </div>
                  <div className="flex items-center space-x-3">
                    <span className="text-[#B89355] flex-shrink-0"><Icons.Phone /></span>
                    <a href={`https://wa.me/${cleanWA}`} target="_blank" rel="noopener noreferrer" className="hover:text-[#1F5946] hover:underline font-bold text-slate-800">
                      {settings.whatsapp}
                    </a>
                  </div>
                </div>
              </div>

              <div className="space-y-4">
                <h4 className="font-bold text-slate-900 text-base">Navigasi Halaman</h4>
                <ul className="space-y-2.5 text-xs text-slate-600 font-medium">
                  <li><a href="#beranda" className="hover:text-[#1F5946] transition">Beranda</a></li>
                  <li><a href="#tentang" className="hover:text-[#1F5946] transition">Tentang Kami</a></li>
                  <li><a href="#program" className="hover:text-[#1F5946] transition">Program Infaq</a></li>
                  <li><a href="#galeri" className="hover:text-[#1F5946] transition">Galeri Kegiatan</a></li>
                </ul>
              </div>

              <div className="space-y-4">
                <h4 className="font-bold text-slate-900 text-base">Media Sosial</h4>
                <div className="grid grid-cols-3 gap-3 w-max">
                  <a
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Instagram Lembaga Infaq Nurul Hayah"
                    className="w-12 h-12 rounded-xl bg-[#E4405F] hover:bg-[#d62e4c] text-white flex items-center justify-center shadow-sm hover:scale-105 transition-all duration-200"
                  >
                    <Icons.Instagram />
                  </a>

                  <a
                    href={`https://www.tiktok.com/search?q=${encodeURIComponent(settings.tiktok)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="TikTok Lembaga Infaq Nurul Hayah"
                    className="w-12 h-12 rounded-xl bg-[#010101] hover:bg-black text-white flex items-center justify-center shadow-sm hover:scale-105 transition-all duration-200"
                  >
                    <Icons.TikTok />
                  </a>

                  <a
                    href="https://www.youtube.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="YouTube Lembaga Infaq Nurul Hayah"
                    className="w-12 h-12 rounded-xl bg-[#FF0000] hover:bg-[#e60000] text-white flex items-center justify-center shadow-sm hover:scale-105 transition-all duration-200"
                  >
                    <Icons.YouTube />
                  </a>

                  <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Facebook Lembaga Infaq Nurul Hayah"
                    className="w-12 h-12 rounded-xl bg-[#1877F2] hover:bg-[#0d65d9] text-white flex items-center justify-center shadow-sm hover:scale-105 transition-all duration-200"
                  >
                    <Icons.Facebook />
                  </a>

                  <a
                    href={`https://wa.me/${cleanWA}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="WhatsApp Layanan Nurul Hayah"
                    className="w-12 h-12 rounded-xl bg-[#25D366] hover:bg-[#1fbe5a] text-white flex items-center justify-center shadow-sm hover:scale-105 transition-all duration-200"
                  >
                    <Icons.WhatsApp />
                  </a>
                </div>
              </div>

            </div>

            <div className="pt-8 text-center text-xs text-slate-500 font-medium space-y-1">
              <p>Copyright © 2026 Lembaga Infaq Nurul Hayah. All Rights Reserved.</p>
              <p className="text-[11px] text-slate-400">Amanah Bersama, Sejahtera dan Berdaya</p>
            </div>
          </div>
        </footer>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
